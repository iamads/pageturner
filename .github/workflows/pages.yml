name: Deploy mobile PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - feat/mobile-pwa
    paths:
      - "mobile-pwa/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test endpoint, pairing link and app flows
        run: node --test tests/test_pwa_*.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-pwa
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
